name: BTC 모의매매 (3단계)

# btc/research/success_criteria.md 3단계 — 고정한 후보를 매일 00:00 UTC 마감 봉에서 판단합니다.
# 00:20 UTC: 비트스탬프 1분봉이 00:00까지 다 들어온 뒤. GitHub이 늦게 시작해도 step이 빠진 날을 순서대로 따라잡습니다
# (판단은 그 봉 종가까지, 월간 학습은 고정된 학습 자르기 c(T) = T + 1일까지의 데이터만 쓰므로 결과는 같음).
# 등록(register)은 사람이 따로 합니다.
#
# 고정: 등록부(registry.json)에 적힌 커밋을 따로 꺼내(git worktree) 그 코드로 step·report를 돌리고,
# numpy·pandas는 등록 당시 버전으로 설치합니다. 데이터는 이 체크아웃의 data/btc/paper 를 읽고 씁니다.
# 그래서 연구 쪽이 btc/ 를 계속 고쳐도 모의매매는 멈추지 않습니다.

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: btc-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAPER_DIR: ${{ github.workspace }}/data/btc/paper
      BASE_15M: ${{ github.workspace }}/data/btc/btcusd_15m.csv.gz
      OPENBLAS_CORETYPE: Haswell      # 러너 CPU가 달라도 같은 BLAS 커널 (월간 학습 결과의 마지막 비트 흔들림 줄임)
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 등록부 읽기 (고정 커밋·파이썬 버전)
        id: reg
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          p = os.environ["PAPER_DIR"] + "/registry.json"
          v = json.load(open(p, encoding="utf-8"))["variants"] if os.path.exists(p) else {}
          commits = sorted({(e.get("git") or {}).get("commit") or "" for e in v.values()} - {""})
          pys = [(e.get("env") or {}).get("python", "") for e in v.values()]
          py = ".".join(pys[0].split(".")[:2]) if pys and pys[0] else "3.11"
          print("commits=" + " ".join(commits))
          print("python=" + py)
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.reg.outputs.commits != ''
        with:
          python-version: ${{ steps.reg.outputs.python }}

      - name: "모의매매 한 걸음 (커밋마다 데이터 덧붙이기 → 월간 재학습 → 판단 → 장부 → 보고서)"
        if: steps.reg.outputs.commits != ''
        # 등록 직후 첫 실행은 2017-01부터 재학습 사슬을 다시 돌립니다. 35분이 지나면 새 달 학습을 멈추고
        # 저장한 뒤 끝냅니다 — 다음 실행이 같은 결과로 이어 갑니다.
        timeout-minutes: 40
        run: |
          set +e
          rc=0
          for sha in ${{ steps.reg.outputs.commits }}; do
            dir="$RUNNER_TEMP/frozen/$sha"
            if ! { git fetch --no-tags --depth=1 origin "$sha" && git worktree add --detach "$dir" "$sha"; }; then
              echo "::error::등록된 커밋 $sha 을 꺼낼 수 없습니다 (push 됐는지 확인)"; rc=1; continue
            fi
            pins=$(SHA="$sha" python3 -c 'import json, os
          v = json.load(open(os.environ["PAPER_DIR"] + "/registry.json", encoding="utf-8"))["variants"]
          print(" ".join(sorted({k + "==" + x for e in v.values() if (e.get("git") or {}).get("commit") == os.environ["SHA"]
                                 for k, x in (e.get("pins") or {}).items()})))')
            echo "커밋 $sha — 설치: $pins"
            python -m pip install --quiet $pins || rc=1
            ( cd "$dir" && python -u -m btc.research.paper --dir "$PAPER_DIR" --base "$BASE_15M" \
                step --only-commit "$sha" --max-minutes 35 --workers 2 ) || rc=$?
            ( cd "$dir" && python -u -m btc.research.paper --dir "$PAPER_DIR" --base "$BASE_15M" \
                report --only-commit "$sha" ) || rc=$?
          done
          exit $rc

      - name: 결과 커밋
        if: always() && steps.reg.outputs.commits != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 모델 보관본(models/)·쓰다 만 파일(*.tmp)은 올리지 않음 (.gitignore 에도 같은 규칙)
          git add -- data/btc/paper ':(exclude,glob)data/btc/paper/**/models/**' ':(exclude,glob)data/btc/paper/**/*.tmp' \
                     ':(exclude,glob)data/btc/paper/**/*.tmp.*'
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "BTC 모의매매 $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
